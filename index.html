<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inicio</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  overflow: hidden;
  background: #000;
}

/* HEADER */
.header {
  position: absolute;
  top: 4px;
  width: 100%;
  text-align: center;
  z-index: 20;
}

/* LOGO / BRAND */
.brand {
  font-size: 54px;
  font-weight: 820;
  letter-spacing: 6px;
  color: white;

  text-shadow:
    0 0 10px rgba(255,255,255,0.25),
    0 0 25px rgba(255,0,255,0.15),
    0 0 35px rgba(0,150,255,0.15);
}

/* Pregunta central */
.center-question {
  position: absolute;
  top: 70px;
  width: 100%;
  display: flex;
  justify-content: center;
  z-index: 10;
}

.center-question span {
  font-size: 22px;
  font-weight: 500;
  color: #ffffffcc;
  letter-spacing: 1px;

  padding: 10px 25px;
  border-radius: 999px;

  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  border: 1px solid rgba(255, 255, 255, 0.15);

  box-shadow: 0 0 20px rgba(255,255,255,0.08);
}

/* Lados */
.side {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: 0.4s ease;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

/* Glow animado */
.side::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 60%);
  animation: moveGlow 6s infinite linear;
}

@keyframes moveGlow {
  0% { transform: translate(-25%, -25%); }
  50% { transform: translate(-10%, -40%); }
  100% { transform: translate(-25%, -25%); }
}

/* PORTFOLIO */
.portfolio {
  background: url("Portfolio.png") center/cover no-repeat;
}

.portfolio::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,0,87,0.55), rgba(138,43,226,0.55));
  z-index: 1;
}

/* LINKS */
.links {
  background: url("Linkz.png") center/cover no-repeat;
}

.links::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,198,255,0.55), rgba(0,114,255,0.55));
  z-index: 1;
}

/* ========================= */
/* RESPONSIVE MOVIL */
/* ========================= */
@media (max-width: 768px) {

  body {
    flex-direction: column;
  }

  .side {
    width: 100%;
    min-height: 50vh;
  }

  .side:hover {
    flex: 1;
  }

  .header {
    top: 10px;
  }

  .brand {
    font-size: 36px;
    letter-spacing: 3px;
  }

  .center-question {
    top: 60px;
    padding: 0 15px;
  }

  .center-question span {
    font-size: 16px;
    text-align: center;
    padding: 8px 18px;
  }

  .card {
    padding: 20px;
  }

  .card h1 {
    font-size: 34px;
  }

  .card p {
    font-size: 14px;
  }
}

/* CARD */
.card {
  text-align: center;
  color: white;
  padding: 30px;
  border-radius: 20px;
  transition: 0.3s ease;
  z-index: 2;
  position: relative;
}

.card h1 {
  font-size: 48px;
  font-weight: 700;
  text-shadow:
    0 0 2px rgba(0,0,0,0.6),
    0 0 6px rgba(0,0,0,0.4),
    0 2px 10px rgba(0,0,0,0.3);
}

.card p {
  opacity: 0.9;
  font-weight: 300;
  text-shadow:
    0 0 2px rgba(0,0,0,0.6),
    0 0 6px rgba(0,0,0,0.35);
}

/* Hover */
.side:hover {
  flex: 1.2;
  filter: brightness(1.1);
}

.side:hover .card {
  transform: scale(1.08);
}
</style>

</head>
<body>

<!-- BRAND -->
<div class="header">
  <div class="brand">Deimor</div>
</div>

<div class="center-question">
  <span>¿Qué deseas encontrar?</span>
</div>

<div class="side portfolio" onclick="location.href='portfolio.html'">
  <div class="card">
    <h1>Portfolio</h1>
    <p>Proyectos, skills y trabajos</p>
  </div>
</div>

<div class="side links" onclick="location.href='links.html'">
  <div class="card">
    <h1>Conexiones</h1>
    <p>Redes, contacto y más</p>
  </div>
</div>

</body>
</html>
